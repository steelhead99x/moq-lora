name: ci

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test --all-targets
      - name: build
        run: cargo build --release

  sx1276:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - name: driver fmt, clippy, test
        working-directory: vendor/sx1276
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

  armv7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: armv7-unknown-linux-musleabihf,armv7-unknown-linux-gnueabihf
      - name: musl (Pi binaries, rust-lld)
        run: cargo build --release -p moq-lora-send -p moq-lora-recv --target armv7-unknown-linux-musleabihf
      - name: install armhf cross gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: gnueabihf
        run: cargo build --release -p moq-lora-send -p moq-lora-recv --target armv7-unknown-linux-gnueabihf

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
          targets: thumbv6m-none-eabi
      - name: shipped UF2 matches SHA256SUMS
        working-directory: firmware
        run: sha256sum -c SHA256SUMS
      - name: fmt, clippy, build
        working-directory: firmware/catwan-fw
        run: |
          cargo fmt --all --check
          cargo clippy --release --target thumbv6m-none-eabi -- -D warnings
          cargo build --release --target thumbv6m-none-eabi
