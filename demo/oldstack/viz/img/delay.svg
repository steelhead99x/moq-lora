<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Software delay per message (log scale)"><title>Software delay per message (log scale)</title><desc>Log scale bar chart of median software latency, old stack versus moq-lora.</desc><style>
:root{--bg:#ffffff;--fg:#1d2330;--mut:#5b6475;--grid:#d9dde5;--box:#f3f5f9;--line:#9aa3b5;--old:#d9822b;--moq:#1b9aaa;--bad:#c8402f;--ok:#2e9b57;--warn:#b8860b}
@media (prefers-color-scheme: dark){:root{--bg:#10141c;--fg:#e8ecf4;--mut:#9aa5ba;--grid:#2a3242;--box:#1a2130;--line:#56627a;--old:#f0a04b;--moq:#43c3d2;--bad:#ef6f5e;--ok:#5fcf86;--warn:#e0b84a}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.t{font-size:26px;font-weight:700}.st{font-size:15px;fill:var(--mut)}.h{font-size:16px;font-weight:700}
.b{font-size:14px}.s{font-size:12px;fill:var(--mut)}.xs{font-size:11px;fill:var(--mut)}.v{font-size:15px;font-weight:700}
.old{fill:var(--old)}.moq{fill:var(--moq)}.gl{stroke:var(--grid);stroke-width:1}.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.v,.h{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.badge{font-size:12px;font-weight:700;fill:var(--bg)}
</style><rect class="bg" width="960" height="430"/><text x="30" y="44" class="t" text-anchor="start" >Software delay per message (log scale)</text><text x="30" y="68" class="st" text-anchor="start" >Each gridline is 10 times the one before. Shorter is better.</text><text x="30" y="108" class="h" text-anchor="start" >Video frame (p50, run with no loss)</text><text x="190" y="136.32" class="b" text-anchor="end" >old stack</text><rect x="200" y="120" width="545.7436443560947" height="24" rx="4" class="old" /><text x="190" y="168.32" class="b" text-anchor="end" >moq-lora</text><rect x="200" y="152" width="57.53629989685236" height="24" rx="4" class="moq" /><text x="30" y="206" class="h" text-anchor="start" >Small sensor reading (p50)</text><text x="190" y="234.32" class="b" text-anchor="end" >old stack</text><rect x="200" y="218" width="212.96007252998933" height="24" rx="4" class="old" /><text x="190" y="266.32" class="b" text-anchor="end" >moq-lora</text><rect x="200" y="250" width="42.01297716700764" height="24" rx="4" class="moq" /><line x1="200.0" y1="104" x2="200.0" y2="280" class="gl" /><text x="200.0" y="296" class="xs" text-anchor="middle" >0.1 ms</text><line x1="406.66666666666663" y1="104" x2="406.66666666666663" y2="280" class="gl" /><text x="406.66666666666663" y="296" class="xs" text-anchor="middle" >1 ms</text><line x1="613.3333333333333" y1="104" x2="613.3333333333333" y2="280" class="gl" /><text x="613.3333333333333" y="296" class="xs" text-anchor="middle" >10 ms</text><line x1="820.0" y1="104" x2="820.0" y2="280" class="gl" /><text x="820.0" y="296" class="xs" text-anchor="middle" >100 ms</text><text x="30" y="326" class="s" text-anchor="start" >For video that is about 230 times less software delay. This is the time inside the programs, not on the radio:</text><text x="30" y="342" class="s" text-anchor="start" >the radio is replaced by localhost here, so real radio time (milliseconds per frame) comes on top for both.</text><text x="30" y="358" class="s" text-anchor="start" >The old stack is Python, so a C/Go production stack would do better than this bar suggests. Sensor readings are close.</text><text x="30" y="418" class="xs" text-anchor="start" >Measured 2026-11-19, one run, simulated radio on localhost. Source: results/results.json. Both stacks send the same payloads on the same schedule.</text><text x="753.7436443560947" y="136.8" class="v">43.7 ms</text><text x="265.53629989685237" y="168.8" class="v">0.19 ms</text><text x="420.96007252998936" y="234.8" class="v">1.07 ms</text><text x="250.01297716700765" y="266.8" class="v">0.16 ms</text></svg>
