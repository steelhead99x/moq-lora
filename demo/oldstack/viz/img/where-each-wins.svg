<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-label="Where each one wins"><title>Where each one wins</title><desc>Two column panel comparing where moq-lora wins and where LoRaWAN wins.</desc><style>
:root{--bg:#ffffff;--fg:#1d2330;--mut:#5b6475;--grid:#d9dde5;--box:#f3f5f9;--line:#9aa3b5;--old:#d9822b;--moq:#1b9aaa;--bad:#c8402f;--ok:#2e9b57;--warn:#b8860b}
@media (prefers-color-scheme: dark){:root{--bg:#10141c;--fg:#e8ecf4;--mut:#9aa5ba;--grid:#2a3242;--box:#1a2130;--line:#56627a;--old:#f0a04b;--moq:#43c3d2;--bad:#ef6f5e;--ok:#5fcf86;--warn:#e0b84a}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.t{font-size:26px;font-weight:700}.st{font-size:15px;fill:var(--mut)}.h{font-size:16px;font-weight:700}
.b{font-size:14px}.s{font-size:12px;fill:var(--mut)}.xs{font-size:11px;fill:var(--mut)}.v{font-size:15px;font-weight:700}
.old{fill:var(--old)}.moq{fill:var(--moq)}.gl{stroke:var(--grid);stroke-width:1}.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.v,.h{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.badge{font-size:12px;font-weight:700;fill:var(--bg)}
</style><rect class="bg" width="960" height="520"/><text x="30" y="44" class="t" text-anchor="start" >Where each one wins</text><text x="30" y="68" class="st" text-anchor="start" >Pick by the job. This demo does not say one is better at everything.</text><rect x="30" y="92" width="440" height="36" rx="8" class="moq" /><text x="46" y="116" class="badge" text-anchor="start" style="font-size:17px">moq-lora wins</text><text x="36" y="154" class="h" text-anchor="start" >Video</text><text x="36" y="172" class="s" text-anchor="start" >96% playable vs 69% at 1% loss</text><text x="36" y="203" class="h" text-anchor="start" >Fits the channel</text><text x="36" y="221" class="s" text-anchor="start" >video uses 79% of the FSK link; LoRa DR4 would need 1,693% (computed)</text><text x="36" y="252" class="h" text-anchor="start" >Less software delay</text><text x="36" y="270" class="s" text-anchor="start" >video 0.19 ms vs 43.7 ms (p50, localhost)</text><text x="36" y="301" class="h" text-anchor="start" >Commands</text><text x="36" y="319" class="s" text-anchor="start" >0.27 ms vs 1.9 s round trip (Class A, uplink every 2 s)</text><text x="36" y="350" class="h" text-anchor="start" >Fewer hops</text><text x="36" y="368" class="s" text-anchor="start" >radio to receiver. No gateway, network server or broker</text><rect x="490" y="92" width="440" height="36" rx="8" class="old" /><text x="506" y="116" class="badge" text-anchor="start" style="font-size:17px">LoRaWAN wins</text><text x="496" y="154" class="h" text-anchor="start" >Tiny sensor readings</text><text x="496" y="172" class="s" text-anchor="start" >25 bytes on air per 12-byte reading vs 192 for moq-lora</text><text x="496" y="203" class="h" text-anchor="start" >Range</text><text x="496" y="221" class="s" text-anchor="start" >LoRa at this setting hears much weaker signals: kilometres. moq-lora's</text><text x="496" y="236" class="s" text-anchor="start" >runs were a metre apart</text><text x="496" y="267" class="h" text-anchor="start" >Not tested here, either side</text><text x="496" y="285" class="s" text-anchor="start" >range, real radio loss, battery life. This demo cannot rank those</text><text x="30" y="494" class="xs" text-anchor="start" >moq-lora's defaults are tuned for video (a 17 byte header, 16 byte tag, a repair frame and padding), which costs it on tiny readings.</text><text x="30" y="508" class="xs" text-anchor="start" >Measured 2026-11-19, one run, simulated radio on localhost. Source: results/results.json.</text></svg>
