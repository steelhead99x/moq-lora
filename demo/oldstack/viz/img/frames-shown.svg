<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Video frames that reach the screen at 1% radio loss"><title>Video frames that reach the screen at 1% radio loss</title><desc>Bar chart of delivered and decodable frames for the old stack and moq-lora.</desc><style>
:root{--bg:#ffffff;--fg:#1d2330;--mut:#5b6475;--grid:#d9dde5;--box:#f3f5f9;--line:#9aa3b5;--old:#d9822b;--moq:#1b9aaa;--bad:#c8402f;--ok:#2e9b57;--warn:#b8860b}
@media (prefers-color-scheme: dark){:root{--bg:#10141c;--fg:#e8ecf4;--mut:#9aa5ba;--grid:#2a3242;--box:#1a2130;--line:#56627a;--old:#f0a04b;--moq:#43c3d2;--bad:#ef6f5e;--ok:#5fcf86;--warn:#e0b84a}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.t{font-size:26px;font-weight:700}.st{font-size:15px;fill:var(--mut)}.h{font-size:16px;font-weight:700}
.b{font-size:14px}.s{font-size:12px;fill:var(--mut)}.xs{font-size:11px;fill:var(--mut)}.v{font-size:15px;font-weight:700}
.old{fill:var(--old)}.moq{fill:var(--moq)}.gl{stroke:var(--grid);stroke-width:1}.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.v,.h{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.badge{font-size:12px;font-weight:700;fill:var(--bg)}
</style><rect class="bg" width="960" height="430"/><line x1="840.0" y1="104" x2="840.0" y2="286" class="gl"/><line x1="680.0" y1="104" x2="680.0" y2="286" class="gl"/><line x1="520.0" y1="104" x2="520.0" y2="286" class="gl"/><line x1="360.0" y1="104" x2="360.0" y2="286" class="gl"/><line x1="200.0" y1="104" x2="200.0" y2="286" class="gl"/><text x="30" y="44" class="t" text-anchor="start" >Video frames that reach the screen at 1% radio loss</text><text x="30" y="68" class="st" text-anchor="start" >300 frames (a 20 second clip), same video and same losses sent through both paths</text><text x="30" y="112" class="h" text-anchor="start" >Frames that arrived</text><text x="190" y="140.32" class="b" text-anchor="end" >old stack</text><rect x="200" y="124" width="603.7333333333332" height="24" rx="4" class="old" /><text x="190" y="172.32" class="b" text-anchor="end" >moq-lora</text><rect x="200" y="156" width="637.8666666666667" height="24" rx="4" class="moq" /><text x="30" y="214" class="h" text-anchor="start" >Frames you can actually play (decodable)</text><text x="190" y="242.32" class="b" text-anchor="end" >old stack</text><rect x="200" y="226" width="441.59999999999997" height="24" rx="4" class="old" /><text x="190" y="274.32" class="b" text-anchor="end" >moq-lora</text><rect x="200" y="258" width="614.4" height="24" rx="4" class="moq" /><text x="200.0" y="302" class="xs" text-anchor="middle" >0%</text><text x="360.0" y="302" class="xs" text-anchor="middle" >25%</text><text x="520.0" y="302" class="xs" text-anchor="middle" >50%</text><text x="680.0" y="302" class="xs" text-anchor="middle" >75%</text><text x="840.0" y="302" class="xs" text-anchor="middle" >100%</text><text x="30" y="330" class="s" text-anchor="start" >Why 'playable' is lower: video frames lean on the frames before them. Once one is lost, the rest of that one-second group</text><text x="30" y="346" class="s" text-anchor="start" >cannot be shown until the next keyframe (the GOP rule, same check for both stacks).</text><text x="30" y="362" class="s" text-anchor="start" >The old stack sends each frame as about 7 separate uplinks with no repair. moq-lora adds one repair frame per 8 and rebuilt 17 lost ones.</text><text x="30" y="418" class="xs" text-anchor="start" >Measured 2026-11-19, one run, simulated radio on localhost. Source: results/results.json. One run: other seeds give somewhat different playable numbers.</text><text x="811.7333333333332" y="140.8" class="v">94.3%</text><text x="845.8666666666667" y="172.8" class="v">99.7%</text><text x="649.5999999999999" y="242.8" class="v">69.0%</text><text x="822.4" y="274.8" class="v">96.0%</text></svg>
