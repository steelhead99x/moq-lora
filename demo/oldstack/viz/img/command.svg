<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-label="Sending a command back: why Class A waits"><title>Sending a command back: why Class A waits</title><desc>Timeline showing the receive windows of a Class A device versus an immediate moq-lora command.</desc><style>
:root{--bg:#ffffff;--fg:#1d2330;--mut:#5b6475;--grid:#d9dde5;--box:#f3f5f9;--line:#9aa3b5;--old:#d9822b;--moq:#1b9aaa;--bad:#c8402f;--ok:#2e9b57;--warn:#b8860b}
@media (prefers-color-scheme: dark){:root{--bg:#10141c;--fg:#e8ecf4;--mut:#9aa5ba;--grid:#2a3242;--box:#1a2130;--line:#56627a;--old:#f0a04b;--moq:#43c3d2;--bad:#ef6f5e;--ok:#5fcf86;--warn:#e0b84a}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.t{font-size:26px;font-weight:700}.st{font-size:15px;fill:var(--mut)}.h{font-size:16px;font-weight:700}
.b{font-size:14px}.s{font-size:12px;fill:var(--mut)}.xs{font-size:11px;fill:var(--mut)}.v{font-size:15px;font-weight:700}
.old{fill:var(--old)}.moq{fill:var(--moq)}.gl{stroke:var(--grid);stroke-width:1}.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.v,.h{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.badge{font-size:12px;font-weight:700;fill:var(--bg)}
</style><rect class="bg" width="960" height="480"/><text x="30" y="44" class="t" text-anchor="start" >Sending a command back: why Class A waits</text><text x="30" y="68" class="st" text-anchor="start" >A LoRaWAN Class A device only listens for a short time after it speaks.</text><line x1="250.0" y1="96" x2="250.0" y2="380" class="gl" /><text x="250.0" y="396" class="xs" text-anchor="middle" >0 s</text><line x1="360.0" y1="96" x2="360.0" y2="380" class="gl" /><text x="360.0" y="396" class="xs" text-anchor="middle" >0.5 s</text><line x1="470.0" y1="96" x2="470.0" y2="380" class="gl" /><text x="470.0" y="396" class="xs" text-anchor="middle" >1 s</text><line x1="580.0" y1="96" x2="580.0" y2="380" class="gl" /><text x="580.0" y="396" class="xs" text-anchor="middle" >1.5 s</text><line x1="690.0" y1="96" x2="690.0" y2="380" class="gl" /><text x="690.0" y="396" class="xs" text-anchor="middle" >2 s</text><line x1="800.0" y1="96" x2="800.0" y2="380" class="gl" /><text x="800.0" y="396" class="xs" text-anchor="middle" >2.5 s</text><line x1="910.0" y1="96" x2="910.0" y2="380" class="gl" /><text x="910.0" y="396" class="xs" text-anchor="middle" >3 s</text><text x="30" y="128" class="h" text-anchor="start" >Old stack</text><text x="30" y="146" class="s" text-anchor="start" >Class A</text><text x="30" y="162" class="s" text-anchor="start" >(talks every 2 s)</text><rect x="247.0" y="112" width="6" height="30" rx="2" class="old" /><text x="250.0" y="106" class="xs" text-anchor="middle" >device sends</text><rect x="470.0" y="112" width="26.399999999999977" height="30" rx="2" class="box" style="stroke:var(--old)"/><text x="474.0" y="106" class="xs" text-anchor="start" >listens</text><rect x="687.0" y="112" width="6" height="30" rx="2" class="old" /><text x="690.0" y="106" class="xs" text-anchor="middle" >device sends</text><rect x="910.0" y="112" width="26.40000000000009" height="30" rx="2" class="box" style="stroke:var(--old)"/><text x="914.0" y="106" class="xs" text-anchor="start" >listens</text><path d="M349.0 186 L349.0 150" class="ln" style="stroke:var(--bad)"/><text x="349.0" y="202" class="xs" text-anchor="middle" style="fill:var(--bad)">app queues a command</text><rect x="349.0" y="214" width="561.0" height="16" rx="3" class="old" style="opacity:.25"/><text x="355.0" y="226" class="xs" text-anchor="start" >waits: the device is not listening</text><text x="910.0" y="250" class="xs" text-anchor="middle" >heard</text><text x="30" y="262" class="xs" text-anchor="start" >(positions of this one example are illustrative)</text><text x="30" y="296" class="h" text-anchor="start" >Measured round trips</text><text x="30" y="312" class="s" text-anchor="start" >10 commands, old stack</text><circle cx="676.1" cy="300" r="5" class="old" style="opacity:.85"/><circle cx="631.3" cy="310" r="5" class="old" style="opacity:.85"/><circle cx="757.3" cy="320" r="5" class="old" style="opacity:.85"/><circle cx="794.0" cy="300" r="5" class="old" style="opacity:.85"/><circle cx="577.2" cy="310" r="5" class="old" style="opacity:.85"/><circle cx="472.4" cy="320" r="5" class="old" style="opacity:.85"/><circle cx="491.7" cy="300" r="5" class="old" style="opacity:.85"/><circle cx="843.9" cy="310" r="5" class="old" style="opacity:.85"/><circle cx="782.0" cy="320" r="5" class="old" style="opacity:.85"/><circle cx="649.1" cy="300" r="5" class="old" style="opacity:.85"/><line x1="676.0584532600001" y1="286" x2="676.0584532600001" y2="336" class="ln" style="stroke:var(--old);stroke-dasharray:4 3"/><text x="682.0584532600001" y="346" class="v" text-anchor="start" style="fill:var(--old)">p50 1.94 s</text><text x="30" y="372" class="s" text-anchor="start" >10 commands, moq-lora</text><circle cx="283.6" cy="362" r="5" class="moq" style="opacity:.85"/><circle cx="250.1" cy="368" r="5" class="moq" style="opacity:.85"/><circle cx="250.1" cy="374" r="5" class="moq" style="opacity:.85"/><circle cx="250.1" cy="362" r="5" class="moq" style="opacity:.85"/><circle cx="250.1" cy="368" r="5" class="moq" style="opacity:.85"/><circle cx="250.1" cy="374" r="5" class="moq" style="opacity:.85"/><circle cx="250.0" cy="362" r="5" class="moq" style="opacity:.85"/><circle cx="250.0" cy="368" r="5" class="moq" style="opacity:.85"/><circle cx="250.1" cy="374" r="5" class="moq" style="opacity:.85"/><circle cx="250.0" cy="362" r="5" class="moq" style="opacity:.85"/><text x="327.0" y="372" class="b" text-anchor="start" style="fill:var(--moq)">p50 0.27 ms: a command is just an object, nothing to wait for</text><text x="30" y="454" class="xs" text-anchor="start" >One slow moq-lora sample (153 ms) is the first command of the run, released after the receiver's 150 ms idle rule.</text><text x="30" y="468" class="xs" text-anchor="start" >Measured 2026-11-19, one run, simulated radio on localhost. Source: results/results.json. Old stack delay scales with the uplink interval (here every 2 s).</text></svg>
