<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-label="Radio channel time the traffic needs"><title>Radio channel time the traffic needs</title><desc>Bar chart of computed channel use for video and sensor traffic on LoRa DR4 versus the FSK link.</desc><style>
:root{--bg:#ffffff;--fg:#1d2330;--mut:#5b6475;--grid:#d9dde5;--box:#f3f5f9;--line:#9aa3b5;--old:#d9822b;--moq:#1b9aaa;--bad:#c8402f;--ok:#2e9b57;--warn:#b8860b}
@media (prefers-color-scheme: dark){:root{--bg:#10141c;--fg:#e8ecf4;--mut:#9aa5ba;--grid:#2a3242;--box:#1a2130;--line:#56627a;--old:#f0a04b;--moq:#43c3d2;--bad:#ef6f5e;--ok:#5fcf86;--warn:#e0b84a}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.t{font-size:26px;font-weight:700}.st{font-size:15px;fill:var(--mut)}.h{font-size:16px;font-weight:700}
.b{font-size:14px}.s{font-size:12px;fill:var(--mut)}.xs{font-size:11px;fill:var(--mut)}.v{font-size:15px;font-weight:700}
.old{fill:var(--old)}.moq{fill:var(--moq)}.gl{stroke:var(--grid);stroke-width:1}.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.v,.h{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.badge{font-size:12px;font-weight:700;fill:var(--bg)}
</style><rect class="bg" width="960" height="440"/><line x1="235.55555555555554" y1="104" x2="235.55555555555554" y2="282" class="ln" style="stroke:var(--bad);stroke-dasharray:5 4"/><text x="30" y="44" class="t" text-anchor="start" >Radio channel time the traffic needs</text><text x="30" y="68" class="st" text-anchor="start" >20 seconds of traffic. 100% means the channel is full. Above 100% it cannot keep up.</text><rect x="660" y="22" width="270" height="30" rx="15" class="box" style="stroke:var(--warn)"/><text x="795" y="42" class="h" text-anchor="middle" style="fill:var(--warn)">COMPUTED, NOT MEASURED</text><text x="30" y="108" class="h" text-anchor="start" >Video, 180 kbit/s stream</text><text x="190" y="136.32" class="b" text-anchor="end" >LoRa DR4</text><rect x="200" y="120" width="601.9083678731961" height="24" rx="4" class="old" /><text x="190" y="168.32" class="b" text-anchor="end" >FSK 300k</text><rect x="200" y="152" width="28.16208733403029" height="24" rx="4" class="moq" /><text x="30" y="206" class="h" text-anchor="start" >Sensor readings, 20 per second</text><text x="190" y="234.32" class="b" text-anchor="end" >LoRa DR4</text><rect x="200" y="218" width="20.11591111111111" height="24" rx="4" class="old" /><text x="190" y="266.32" class="b" text-anchor="end" >FSK 300k</text><rect x="200" y="250" width="4.058074074074074" height="24" rx="4" class="moq" /><text x="240.55555555555554" y="296" class="xs" text-anchor="start" style="fill:var(--bad)">100% = full</text><text x="30" y="322" class="s" text-anchor="start" >Video needs about 17 times what one LoRa DR4 channel can carry, and it fits on the FSK link at 79%.</text><text x="30" y="338" class="s" text-anchor="start" >A frame takes about 7 ms on air with FSK and about 166 ms on LoRa DR4 (its fastest US uplink rate).</text><text x="30" y="354" class="s" text-anchor="start" >Both radios are modelled from their formulas (Semtech airtime), lossless. Nothing here was sent over a real radio.</text><text x="30" y="414" class="xs" text-anchor="start" >Radio settings: old = LoRa SF8/500 kHz CR4/5, 8-symbol preamble (US915 DR4); moq-lora = FSK 300 kbit/s, 6-byte preamble, 2-byte sync, CRC-16.</text><text x="30" y="428" class="xs" text-anchor="start" >Source: model block in results/results.json.</text><text x="809.9083678731961" y="136.8" class="v">1,693%</text><text x="236.16208733403028" y="168.8" class="v">79.2%</text><text x="228.1159111111111" y="234.8" class="v">56.6%</text><text x="212.05807407407409" y="266.8" class="v">11.4%</text></svg>
