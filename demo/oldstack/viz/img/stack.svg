<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="Two ways to carry the same data over a radio"><title>Two ways to carry the same data over a radio</title><desc>Left to right path from device to app for the old stack and for moq-lora.</desc><style>
:root{--bg:#ffffff;--fg:#1d2330;--mut:#5b6475;--grid:#d9dde5;--box:#f3f5f9;--line:#9aa3b5;--old:#d9822b;--moq:#1b9aaa;--bad:#c8402f;--ok:#2e9b57;--warn:#b8860b}
@media (prefers-color-scheme: dark){:root{--bg:#10141c;--fg:#e8ecf4;--mut:#9aa5ba;--grid:#2a3242;--box:#1a2130;--line:#56627a;--old:#f0a04b;--moq:#43c3d2;--bad:#ef6f5e;--ok:#5fcf86;--warn:#e0b84a}}
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.bg{fill:var(--bg)}.box{fill:var(--box);stroke:var(--line);stroke-width:1.2}
.t{font-size:26px;font-weight:700}.st{font-size:15px;fill:var(--mut)}.h{font-size:16px;font-weight:700}
.b{font-size:14px}.s{font-size:12px;fill:var(--mut)}.xs{font-size:11px;fill:var(--mut)}.v{font-size:15px;font-weight:700}
.old{fill:var(--old)}.moq{fill:var(--moq)}.gl{stroke:var(--grid);stroke-width:1}.ln{stroke:var(--line);stroke-width:1.5;fill:none}
.v,.h{paint-order:stroke;stroke:var(--bg);stroke-width:5px;stroke-linejoin:round}
.badge{font-size:12px;font-weight:700;fill:var(--bg)}
</style><rect class="bg" width="960" height="430"/><text x="30" y="44" class="t" text-anchor="start" >Two ways to carry the same data over a radio</text><text x="30" y="68" class="st" text-anchor="start" >The old LoRaWAN path has six steps. moq-lora has four.</text><text x="30" y="104" class="h" text-anchor="start" >Old stack (LoRaWAN style, built here in Python)</text><rect x="30" y="118" width="128" height="92" rx="8" class="box" style="stroke:var(--old)"/><text x="94.0" y="144" class="h" text-anchor="middle" >Device</text><text x="94.0" y="166" class="s" text-anchor="middle" >sends small</text><text x="94.0" y="181" class="s" text-anchor="middle" >LoRaWAN frames</text><circle cx="44" cy="130" r="0"/><path d="M160 164 L171 164" class="ln"/><path d="M169 159 L178 164 L169 169" class="ln"/><rect x="178" y="118" width="128" height="92" rx="8" class="box" style="stroke:var(--old)"/><text x="242.0" y="144" class="h" text-anchor="middle" >LoRa radio</text><text x="242.0" y="166" class="s" text-anchor="middle" >slow, long range</text><text x="242.0" y="181" class="s" text-anchor="middle" >(US915 DR4)</text><circle cx="192" cy="130" r="0"/><path d="M308 164 L319 164" class="ln"/><path d="M317 159 L326 164 L317 169" class="ln"/><rect x="326" y="118" width="128" height="92" rx="8" class="box" style="stroke:var(--old)"/><text x="390.0" y="144" class="h" text-anchor="middle" >Gateway</text><text x="390.0" y="166" class="s" text-anchor="middle" >wraps each frame</text><text x="390.0" y="181" class="s" text-anchor="middle" >in JSON + base64</text><circle cx="340" cy="130" r="0"/><path d="M456 164 L467 164" class="ln"/><path d="M465 159 L474 164 L465 169" class="ln"/><rect x="474" y="118" width="128" height="92" rx="8" class="box" style="stroke:var(--old)"/><text x="538.0" y="144" class="h" text-anchor="middle" >Network server</text><text x="538.0" y="166" class="s" text-anchor="middle" >checks it, wraps</text><text x="538.0" y="181" class="s" text-anchor="middle" >it again</text><circle cx="488" cy="130" r="0"/><path d="M604 164 L615 164" class="ln"/><path d="M613 159 L622 164 L613 169" class="ln"/><rect x="622" y="118" width="128" height="92" rx="8" class="box" style="stroke:var(--old)"/><text x="686.0" y="144" class="h" text-anchor="middle" >MQTT broker</text><text x="686.0" y="166" class="s" text-anchor="middle" >Mosquitto passes</text><text x="686.0" y="181" class="s" text-anchor="middle" >it on</text><circle cx="636" cy="130" r="0"/><path d="M752 164 L763 164" class="ln"/><path d="M761 159 L770 164 L761 169" class="ln"/><rect x="770" y="118" width="128" height="92" rx="8" class="box" style="stroke:var(--old)"/><text x="834.0" y="144" class="h" text-anchor="middle" >App</text><text x="834.0" y="166" class="s" text-anchor="middle" >puts the pieces</text><text x="834.0" y="181" class="s" text-anchor="middle" >back together</text><circle cx="784" cy="130" r="0"/><text x="30" y="232" class="s" text-anchor="start" >Behind the radio: about 8,234 bytes of wrapping and hops per video frame, across 3 programs.</text><text x="30" y="270" class="h" text-anchor="start" >moq-lora (this repo)</text><rect x="30" y="284" width="128" height="92" rx="8" class="box" style="stroke:var(--moq)"/><text x="94.0" y="310" class="h" text-anchor="middle" >Pi + camera</text><text x="94.0" y="332" class="s" text-anchor="middle" >cuts video into</text><text x="94.0" y="347" class="s" text-anchor="middle" >groups and objects</text><path d="M160 330 L171 330" class="ln"/><path d="M169 325 L178 330 L169 335" class="ln"/><rect x="178" y="284" width="128" height="92" rx="8" class="box" style="stroke:var(--moq)"/><text x="242.0" y="310" class="h" text-anchor="middle" >FSK radio</text><text x="242.0" y="332" class="s" text-anchor="middle" >300 kbit/s, much</text><text x="242.0" y="347" class="s" text-anchor="middle" >faster than LoRa</text><path d="M308 330 L319 330" class="ln"/><path d="M317 325 L326 330 L317 335" class="ln"/><rect x="326" y="284" width="128" height="92" rx="8" class="box" style="stroke:var(--moq)"/><text x="390.0" y="310" class="h" text-anchor="middle" >CatWAN stick</text><text x="390.0" y="332" class="s" text-anchor="middle" >USB radio on</text><text x="390.0" y="347" class="s" text-anchor="middle" >the laptop</text><path d="M456 330 L467 330" class="ln"/><path d="M465 325 L474 330 L465 335" class="ln"/><rect x="474" y="284" width="128" height="92" rx="8" class="box" style="stroke:var(--moq)"/><text x="538.0" y="310" class="h" text-anchor="middle" >Laptop</text><text x="538.0" y="332" class="s" text-anchor="middle" >rebuilds the objects,</text><text x="538.0" y="347" class="s" text-anchor="middle" >repairs lost frames</text><rect x="622" y="284" width="308" height="92" rx="8" class="box" style="stroke:var(--line);stroke-dasharray:5 4"/><text x="636" y="310" class="s" text-anchor="start" >The MoQ model, from moq.dev:</text><text x="636" y="326" class="s" text-anchor="start" >one GOP is a group,</text><text x="636" y="342" class="s" text-anchor="start" >one frame is an object.</text><text x="636" y="358" class="s" text-anchor="start" >No QUIC, no relay here.</text><text x="30" y="404" class="xs" text-anchor="start" >Plain version: the old path hands every radio frame through several programs. moq-lora hands it straight to the receiver.</text><text x="30" y="418" class="xs" text-anchor="start" >Radio is simulated on localhost in the demo. The old stack here is Python end to end, so it is slower than a production one.</text></svg>
