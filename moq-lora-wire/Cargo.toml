[package]
name = "moq-lora-wire"
version = "0.1.0"
description = "MoQ-style object/group framing, XOR-parity FEC and H.264 access-unit splitting for <=255 B radio frames"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
# kixel-ai/rind main, pinned (pure-Rust AEAD; armv7 uses its portable/arm backend)
rind = { git = "https://github.com/kixel-ai/rind", rev = "d2dc35bd796aaadc42df56aee0f1526cdee94b66" }

[target.'cfg(unix)'.dependencies]
# O_NONBLOCK for opening the key file, and mkfifo in its test
libc = "0.2"
