[package]
name = "moq-lora-send"
version = "0.1.0"
description = "Pi side: camera/test source -> ffmpeg H.264 -> MoQ-style objects -> SX1276 FSK"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
moq-lora-wire = { path = "../moq-lora-wire" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
moq-lora-pi = { path = "../moq-lora-pi" }
sx1276 = { path = "../vendor/sx1276" }
