[workspace]
resolver = "2"
members = [
    "moq-lora-report","moq-lora-wire", "moq-lora-send", "moq-lora-recv"]
exclude = ["vendor/sx1276", "firmware/catwan-fw"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.82"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
