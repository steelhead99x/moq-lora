[workspace]
resolver = "2"
members = [
    "moq-lora-report", "moq-lora-wire", "moq-lora-pi", "moq-lora-send", "moq-lora-recv"]
# moq-lora-publish needs Rust 1.91 for the moq.dev crates; it builds on its own.
exclude = ["vendor/sx1276", "firmware/catwan-fw", "moq-lora-publish"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/steelhead99x/moq-lora"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
